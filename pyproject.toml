[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.2.0"
description = "Evidence-grounded agent trajectory diagnosis workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1", "openai>=1.0,<3", "filelock>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
tracelens = ["_vendor/trajdebug/**/*", "_vendor/trajdebug/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

